name: "Deploy step simple workflow" 
on:
  push: 
    branches: 
    - deploy
jobs:
  basic-deployment: 
    runs-on: self-hosted
    steps: 
      - name: Checkout the repo
        uses: actions/checkout@v6

      - name: Build the docker image
        run: |
          sudo docker build -t {{ secrets.DOCKERHUB_USERNAME }}/simple-app-basic .

      - name: Log in to docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

    
      - name: Export the docker image 
        run: |
          sudo docker push ${{ secrets.DOCKERHUB_USERNAME }}/simple-app-basic

      

